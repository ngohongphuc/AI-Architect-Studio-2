# Studio kiến trúc hiện đại
[theme]
base = "light"
primaryColor = "#087B81"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#FFFEFC"
textColor = "#172B35"
linkColor = "#11616F"
borderColor = "#E0DED5"
dataframeBorderColor = "#E0DED5"
dataframeHeaderBackgroundColor = "#EBEEEC"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
baseFontSize = 16
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontSizes = ["2rem", "1.5rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [800, 700, 650, 600, 600, 600]
chartCategoricalColors = ["#167D8D", "#C89868", "#547E6B", "#B95D21", "#B4403A", "#456381"]

[theme.sidebar]
backgroundColor = "#F8F5F0"
secondaryBackgroundColor = "#F0ECE5"
borderColor = "#E0DED5"

[client]
toolbarMode = "minimal"
